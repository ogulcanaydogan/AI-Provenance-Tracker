version: 2

updates:
  # Python (pip) — backend dependencies
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    groups:
      pip-weekly-rollup:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore"
      include: "scope"

  # JavaScript (npm) — frontend dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:15"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    groups:
      npm-weekly-rollup:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"
    # eslint-config-next does not yet support these majors: eslint 10 removes
    # context.getFilename() used by its bundled eslint-plugin-react, lucide v1
    # drops icons the UI imports, and typescript 6 is unverified. They break
    # frontend-build, so block the major bumps until the ecosystem catches up
    # (remove an entry to re-enable that major once supported).
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "lucide-react"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore"
      include: "scope"

  # GitHub Actions — CI workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    groups:
      actions-weekly-rollup:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore"
      include: "scope"
